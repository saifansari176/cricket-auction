<div class="container mt-4">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">

        <h3>Team List</h3>

        <div class="d-flex flex-wrap gap-2 team-list-actions">

            <a
                routerLink="/teams/add"
                class="btn btn-success me-2">

                Add Team

            </a>

            <button type="button" class="file-action excel-action import-action" (click)="fileInput.click()" title="Import Excel" aria-label="Import Excel">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H4v20h16V8Z M14 2v6h6 M7 11l5 7m0-7-5 7 M17 18v-7m-3 3 3-3 3 3"/></svg>
                <span>Import Excel</span>
            </button>

            <button type="button" class="btn btn-primary" (click)="exportExcel()">

                Export Excel

            </button>

            <input #fileInput type="file" accept=".xlsx,.xls" hidden (change)="importExcel($event)">

        </div>

    </div>

    <div class="mb-3">
        <input type="search" class="form-control" [(ngModel)]="teamFilter" placeholder="Search teams">
    </div>

    <div class="table-responsive">
    <table class="table table-bordered table-hover">

        <thead class="table-dark text-center">

            <tr>

                <th>#</th>

                <th>Logo</th>

                <th>Team Name</th>

                <th>Owner Name</th>

                <th>Total Points</th>

                <th>Remaining</th>

                <th>Players</th>

                <th class="team-actions">Action</th>

            </tr>

        </thead>

        <tbody>

            <tr *ngFor="let team of filteredTeams; let i=index">

                <td>{{i+1}}</td>

                <td>

                    <img
                        [src]="team.logo"
                        width="50"
                        height="50"
                        class="rounded-circle">

                </td>

                <td>

                    {{team.teamName}}

                </td>

                <td>

                    {{team.ownerName}}

                </td>

                <td>

                    {{team.totalPoints}}

                </td>

                <td>

                    {{team.remainingPoints}}

                </td>

                <td>

                    {{team.playersBought}}

                </td>

                <td class="team-actions">
                    <div class="team-action-buttons">
                        <a
                            [routerLink]="['/teams/edit',team.id!]"
                            class="btn btn-warning btn-sm">
                            Edit
                        </a>

                        <button
                            class="btn btn-danger btn-sm"
                            (click)="deleteTeam(team.id!)">
                            Delete
                        </button>
                    </div>
                </td>

            </tr>

        </tbody>

    </table>
    </div>

</div>
