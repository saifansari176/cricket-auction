<div class="container mt-4">

    <div class="card shadow">

        <div class="text-center p-4">

            <img *ngIf="auction?.logo" [src]="auction?.logo" width="120">

            <h2 class="mt-3">

                {{auction?.auctionName}}

            </h2>

            <h4>

                Team Registration Form

            </h4>

        </div>

        <div class="card-body">

            <form [formGroup]="form" (ngSubmit)="save()">
              <p class="required-fields-hint">Fields marked <span class="required-marker" aria-hidden="true">*</span> are required.</p>

                <div class="row">

                    <div class="col-md-12 text-center mb-3">

                        <img *ngIf="form.value.logo" [src]="form.value.logo" width="120" class="rounded-circle mb-3">

                        <input type="file" accept="image/*" class="form-control" [disabled]="uploading || saving" (change)="onLogoChange($event)">
                        <app-image-cropper *ngIf="cropFile" [file]="cropFile" label="team logo" outputFileName="team-logo.jpg" (cropped)="uploadCroppedLogo($event)" (cancelled)="cropFile = null" />

                    </div>

                    <div class="col-md-6 mb-3">

                        <label for="team-form-teamName">Team Name <span class="required-marker" aria-hidden="true">*</span></label>

                        <input id="team-form-teamName" aria-describedby="team-form-teamName-error" [class.is-invalid]="form.controls.teamName.invalid && form.controls.teamName.touched" [attr.aria-invalid]="form.controls.teamName.invalid && form.controls.teamName.touched" aria-required="true" class="form-control" formControlName="teamName">
                        <app-field-error [control]="form.controls.teamName" label="Team Name" fieldId="team-form-teamName" />
                    </div>

                    <div class="col-md-6 mb-3">

                        <label for="team-form-ownerName">Owner Name</label>

                        <input id="team-form-ownerName" aria-describedby="team-form-ownerName-error" [class.is-invalid]="form.controls.ownerName.invalid && form.controls.ownerName.touched" [attr.aria-invalid]="form.controls.ownerName.invalid && form.controls.ownerName.touched" class="form-control" formControlName="ownerName">
                        <app-field-error [control]="form.controls.ownerName" label="Owner Name" fieldId="team-form-ownerName" />
                    </div>

                </div>

                <div class="text-center">

                    <button type="submit" class="btn btn-success btn-lg" [disabled]="saving || uploading">

                        {{ saving ? 'Saving...' : 'Save Team' }}

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>
