<div class="container mt-4">

    <div class="card shadow">

        <div class="text-center p-4">

            <img *ngIf="auction?.logo" [src]="auction?.logo" width="120">

            <h2 class="mt-3">

                {{auction?.auctionName}}

            </h2>

            <h4>

                Team Registration Form

            </h4>

        </div>

        <div class="card-body">

            <form [formGroup]="form">

                <div class="row">

                    <div class="col-md-12 text-center mb-3">

                        <img *ngIf="form.value.logo" [src]="form.value.logo" width="120" class="rounded-circle mb-3">

                        <input type="file" accept="image/*" class="form-control" (change)="onLogoChange($event)">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Team Name *</label>

                        <input class="form-control" formControlName="teamName">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Owner Name *</label>

                        <input class="form-control" formControlName="ownerName">

                    </div>

                </div>

                <div class="text-center">

                    <button type="button" class="btn btn-success btn-lg" [disabled]="saving || uploading" (click)="save()">

                        {{ saving ? 'Saving...' : 'Save Team' }}

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>
