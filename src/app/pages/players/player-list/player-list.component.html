<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">

    <h2>Player List</h2>

    <div class="d-flex flex-wrap gap-2">

        <a
            routerLink="/players/add"
            class="btn btn-success me-2">

            Add Player

        </a>

         <button
            class="btn btn-primary me-2"
            (click)="fileInput.click()">
            Import Excel
        </button>

        <button
            class="btn btn-primary"
            (click)="exportExcel()">

            Export Excel

        </button>
        
         <input
            #fileInput
            type="file"
            accept=".xlsx,.xls"
            hidden
            (change)="importExcel($event)">

    </div>

</div>

<div class="table-responsive">
<table class="table table-striped table-bordered">

    <thead class="table-dark">

<tr>

    <th>#</th>

    <th>Photo</th>

    <th>First Name</th>
    
    <th>Last Name</th>
    
    <th>Player Type</th>
    
    <th>Base Bid</th>

    <th>Mobile</th>

    <th>Status</th>

    <th>Action</th>

</tr>

    </thead>

    <tbody>
    <tr *ngFor="let player of players; let i=index">

    <td>{{i+1}}</td>
    <td>

      <img
        *ngIf="player.photo && !isPhotoBroken(player.photo)"
        [src]="player.photo"
        width="70"
        height="70"
        (error)="markPhotoBroken(player.photo)"
        style="object-fit:cover;border-radius:8px">

      <div
        *ngIf="!player.photo || isPhotoBroken(player.photo)"
        style="width:70px;height:70px;border-radius:8px;background:#e2e8f0;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:12px">
        No Image
      </div>

    </td>

    <td>{{player.firstName}}</td>
    
    <td>{{player.lastName}}</td>
    
    <td>{{player.playerType}}</td>

    <td>{{player.baseBid}}</td>

    <td>{{player.mobile}}</td>

    <td>{{player.status}}</td>

    <td>

          <a
        [routerLink]="['/players/edit', player.id]"
        class="btn btn-warning btn-sm me-2">

        Edit

    </a>

        <button
            class="btn btn-danger btn-sm"
            (click)="deletePlayer(player.id!)">

            Delete

        </button>

    </td>

</tr>

    </tbody>

</table>
</div>
