<div class="container mt-4">

    <div class="card shadow">

        <div class="text-center p-4">

            <img *ngIf="auction?.logo" [src]="auction?.logo" width="120">

            <h2 class="mt-3">

                {{auction?.auctionName}}

            </h2>

            <h4>

                Player Registration Form

            </h4>

        </div>

        <div class="card-body">

            <form [formGroup]="form" (ngSubmit)="save()">
              <p class="required-fields-hint">Fields marked <span class="required-marker" aria-hidden="true">*</span> are required.</p>

                <div class="row">

                    <div class="col-md-12 mb-3">
                        <label for="player-form-photo">Photo <span class="required-marker" aria-hidden="true">*</span></label>
                        <img *ngIf="form.value.photo" [src]="form.value.photo" width="120" class="rounded-circle mb-3">

                        <input id="player-form-photo" aria-required="true" aria-describedby="player-form-photo-error" [class.is-invalid]="form.controls.photo.invalid && form.controls.photo.touched" [attr.aria-invalid]="form.controls.photo.invalid && form.controls.photo.touched" (blur)="form.controls.photo.markAsTouched()" type="file" accept="image/*" class="form-control" [disabled]="uploadingPhoto || saving" (change)="onPhotoChange($event)">
                        <app-field-error [control]="form.controls.photo" label="Photo" fieldId="player-form-photo" />
                        <app-image-cropper *ngIf="cropFile" [file]="cropFile" (cropped)="uploadCroppedPhoto($event)" (cancelled)="cropFile = null" />
                    </div>

                    <div class="col-md-6 mb-3">

                        <label for="player-form-firstName">First Name <span class="required-marker" aria-hidden="true">*</span></label>

                        <input id="player-form-firstName" aria-describedby="player-form-firstName-error" [class.is-invalid]="form.controls.firstName.invalid && form.controls.firstName.touched" [attr.aria-invalid]="form.controls.firstName.invalid && form.controls.firstName.touched" aria-required="true" class="form-control" formControlName="firstName">
                        <app-field-error [control]="form.controls.firstName" label="First Name" fieldId="player-form-firstName" />
                    </div>

                    <div class="col-md-6 mb-3">

                        <label for="player-form-lastName">Last Name <span class="required-marker" aria-hidden="true">*</span></label>

                        <input id="player-form-lastName" aria-describedby="player-form-lastName-error" [class.is-invalid]="form.controls.lastName.invalid && form.controls.lastName.touched" [attr.aria-invalid]="form.controls.lastName.invalid && form.controls.lastName.touched" aria-required="true" class="form-control" formControlName="lastName">
                        <app-field-error [control]="form.controls.lastName" label="Last Name" fieldId="player-form-lastName" />
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Category</label>
                        <select class="form-select" formControlName="categoryId" (change)="onCategoryChange()">
                            <option value="" disabled>Select Category</option>
                            <option *ngFor="let category of categories" [value]="category.id">{{category.name}}</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">

                        <label for="player-form-jerseyNumber">Jersey Number <span class="required-marker" aria-hidden="true">*</span></label>

                        <input id="player-form-jerseyNumber" aria-describedby="player-form-jerseyNumber-error" [class.is-invalid]="form.controls.jerseyNumber.invalid && form.controls.jerseyNumber.touched" [attr.aria-invalid]="form.controls.jerseyNumber.invalid && form.controls.jerseyNumber.touched" aria-required="true" type="tel" maxlength="3" class="form-control" formControlName="jerseyNumber"
                            placeholder="Enter jersey number" (keypress)="allowOnlyNumbers($event)">
                        <app-field-error [control]="form.controls.jerseyNumber" label="Jersey Number" fieldId="player-form-jerseyNumber" patternMessage="Jersey number must contain 1 to 3 digits." />
                    </div>

                    <div class="col-md-6 mb-3">

                        <label for="player-form-playerType">Player Type <span class="required-marker" aria-hidden="true">*</span></label>

                        <select id="player-form-playerType" aria-describedby="player-form-playerType-error" [class.is-invalid]="form.controls.playerType.invalid && form.controls.playerType.touched" [attr.aria-invalid]="form.controls.playerType.invalid && form.controls.playerType.touched" aria-required="true" class="form-select" formControlName="playerType">

                            <option value="">Select</option>

                            <option>Batsman</option>

                            <option>Bowler</option>

                            <option>All Rounder</option>

                            <option>Wicket Keeper</option>

                        </select>
                        <app-field-error [control]="form.controls.playerType" label="Player Type" fieldId="player-form-playerType" />
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Current Team</label>
                        <input class="form-control" formControlName="currentTeam" placeholder="Enter current team name">
                    </div>

                    <div class="col-md-6 mb-3">

                        <label for="player-form-mobile">Mobile Number <span class="required-marker" aria-hidden="true">*</span></label>

                        <input id="player-form-mobile" aria-describedby="player-form-mobile-error" [class.is-invalid]="form.controls.mobile.invalid && form.controls.mobile.touched" [attr.aria-invalid]="form.controls.mobile.invalid && form.controls.mobile.touched" aria-required="true" type="tel" maxlength="10" class="form-control" formControlName="mobile"
                            placeholder="Enter 10 digit mobile number" (keypress)="allowOnlyNumbers($event)">
                        <app-field-error [control]="form.controls.mobile" label="Mobile Number" fieldId="player-form-mobile" patternMessage="Enter a valid 10-digit mobile number." />
                    </div>

                    <div class="col-md-6 mb-3">

                        <label for="player-form-tshirtSize">T-Shirt Size <span class="required-marker" aria-hidden="true">*</span></label>

                        <select id="player-form-tshirtSize" aria-describedby="player-form-tshirtSize-error" [class.is-invalid]="form.controls.tshirtSize.invalid && form.controls.tshirtSize.touched" [attr.aria-invalid]="form.controls.tshirtSize.invalid && form.controls.tshirtSize.touched" aria-required="true" class="form-select" formControlName="tshirtSize">

                            <option value="">Select</option>

                            <option>S</option>

                            <option>M</option>

                            <option>L</option>

                            <option>XL</option>

                            <option>2XL</option>

                            <option>3XL</option>

                            <option>4XL</option>

                        </select>
                        <app-field-error [control]="form.controls.tshirtSize" label="T-Shirt Size" fieldId="player-form-tshirtSize" />
                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Trouser Size</label>

                        <select class="form-select" formControlName="trouserSize">

                            <option value="">Select</option>

                            <option>28</option>

                            <option>30</option>

                            <option>32</option>

                            <option>34</option>

                            <option>36</option>

                            <option>38</option>

                            <option>40</option>

                            <option>42</option>

                            <option>44</option>

                            <option>46</option>

                            <option>48</option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Base Bid</label>

                        <input type="number" class="form-control" formControlName="baseBid" readonly>

                    </div>

                    <div class="col-md-6 mb-3" *ngIf="isEdit">

                        <label>Status</label>

                        <select class="form-select" formControlName="status">

                            <option value="Available">Available</option>

                            <option value="Unsold">Unsold</option>

                            <option value="Sold">Sold</option>

                        </select>

                    </div>

                    <div class="col-md-12 mb-3">

                        <label>Note</label>

                        <textarea rows="4" class="form-control" formControlName="note">

                        </textarea>

                    </div>

                </div>

                <div class="text-center button-group">

                    <button class="btn btn-success btn-lg" type="submit" [disabled]="saving || uploadingPhoto" >

                        {{saving ? 'Saving...' : (uploadingPhoto ? 'Uploading photo...' : (isEdit ? 'Update Player' : 'Submit Registration'))}}

                    </button>

                    <button class="btn btn-secondary btn-lg" type="button" [disabled]="saving" (click)="cancel()">

                        Cancel

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>
