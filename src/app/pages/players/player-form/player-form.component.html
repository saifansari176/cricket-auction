<div class="container mt-4">

    <div class="card shadow">

        <div class="text-center p-4">

            <img *ngIf="auction?.logo" [src]="auction?.logo" width="120">

            <h2 class="mt-3">

                {{auction?.auctionName}}

            </h2>

            <h4>

                Player Registration Form

            </h4>

        </div>

        <div class="card-body">

            <form [formGroup]="form">

                <div class="row">

                    <div class="col-md-12 mb-3">
                        <label>Photo <span class="text-danger">*</span></label>
                        <img *ngIf="form.value.photo" [src]="form.value.photo" width="120" class="rounded-circle mb-3">

                        <input type="file" accept="image/*" class="form-control" [disabled]="uploadingPhoto || saving" (change)="onPhotoChange($event)">
                        <div class="text-danger mt-1"
                            *ngIf="form.controls.photo.touched && form.controls.photo.invalid">

                            <small *ngIf="form.controls.photo.errors?.['required']">
                                Player Picture is required.
                            </small>

                        </div>
                    </div>

                    <div class="col-md-6 mb-3">

                        <label>First Name<span class="text-danger">*</span></label>

                        <input class="form-control" formControlName="firstName">
                        <div class="text-danger mt-1"
                            *ngIf="form.controls.firstName.touched && form.controls.firstName.invalid">

                            <small *ngIf="form.controls.firstName.errors?.['required']">
                                First Name is required.
                            </small>

                        </div>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Last Name<span class="text-danger">*</span></label>

                        <input class="form-control" formControlName="lastName">
                        <div class="text-danger mt-1"
                            *ngIf="form.controls.lastName.touched && form.controls.lastName.invalid">
                            <small *ngIf="form.controls.lastName.errors?.['required']">
                                Last Name is required.
                            </small>
                        </div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Category</label>
                        <select class="form-select" formControlName="categoryId" (change)="onCategoryChange()">
                            <option value="">Regular Players (default base price)</option>
                            <option *ngFor="let category of categories" [value]="category.id">{{category.name}} —
                                {{category.basePrice}}</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Jersey Number</label>

                        <input type="tel" maxlength="3" class="form-control" formControlName="jerseyNumber"
                            placeholder="Enter jersey number" (keypress)="allowOnlyNumbers($event)">

                        <div class="text-danger mt-1"
                            *ngIf="form.controls.jerseyNumber.touched && form.controls.jerseyNumber.invalid">
                            <small>Jersey number must contain up to 3 digits.</small>
                        </div>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Player Type<span class="text-danger">*</span></label>

                        <select class="form-select" formControlName="playerType">

                            <option value="">Select</option>

                            <option>Batsman</option>

                            <option>Bowler</option>

                            <option>All Rounder</option>

                            <option>Wicket Keeper</option>

                        </select>
                        <div class="text-danger mt-1"
                            *ngIf="form.controls.playerType.touched && form.controls.playerType.invalid">
                            <small *ngIf="form.controls.playerType.errors?.['required']">
                                Player Type is required.
                            </small>
                        </div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Current Team</label>
                        <input class="form-control" formControlName="currentTeam" placeholder="Enter current team name">
                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Mobile Number <span class="text-danger">*</span></label>

                        <input type="tel" maxlength="10" class="form-control" formControlName="mobile"
                            placeholder="Enter 10 digit mobile number" (keypress)="allowOnlyNumbers($event)">

                        <div class="text-danger mt-1"
                            *ngIf="form.controls.mobile.touched && form.controls.mobile.invalid">

                            <small *ngIf="form.controls.mobile.errors?.['required']">
                                Mobile Number is required.
                            </small>

                            <small *ngIf="form.controls.mobile.errors?.['pattern']">
                                Mobile Number must be exactly 10 digits.
                            </small>

                        </div>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>T-Shirt Size<span class="text-danger">*</span></label>

                        <select class="form-select" formControlName="tshirtSize">

                            <option value="">Select</option>

                            <option>S</option>

                            <option>M</option>

                            <option>L</option>

                            <option>XL</option>

                            <option>2XL</option>

                            <option>3XL</option>

                            <option>4XL</option>

                        </select>
                        <div class="text-danger mt-1"
                            *ngIf="form.controls.tshirtSize.touched && form.controls.tshirtSize.invalid">
                            <small *ngIf="form.controls.tshirtSize.errors?.['required']">
                                T-Shirt Size is required.
                            </small>
                        </div>
                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Trouser Size</label>

                        <select class="form-select" formControlName="trouserSize">

                            <option value="">Select</option>

                            <option>28</option>

                            <option>30</option>

                            <option>32</option>

                            <option>34</option>

                            <option>36</option>

                            <option>38</option>

                            <option>40</option>

                            <option>42</option>

                            <option>44</option>

                            <option>46</option>

                            <option>48</option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Base Bid</label>

                        <input type="number" class="form-control" formControlName="baseBid" readonly>

                    </div>

                    <div class="col-md-6 mb-3" *ngIf="isEdit">

                        <label>Status</label>

                        <select class="form-select" formControlName="status">

                            <option value="Available">Available</option>

                            <option value="Unsold">Unsold</option>

                            <option value="Sold">Sold</option>

                        </select>

                    </div>

                    <div class="col-md-12 mb-3">

                        <label>Note</label>

                        <textarea rows="4" class="form-control" formControlName="note">

                        </textarea>

                    </div>

                </div>

                <div class="text-center button-group">

                    <button class="btn btn-success btn-lg" type="button" [disabled]="saving || uploadingPhoto" (click)="save()">

                        {{saving ? 'Saving...' : (uploadingPhoto ? 'Uploading photo...' : (isEdit ? 'Update Player' : 'Submit Registration'))}}

                    </button>

                    <button class="btn btn-secondary btn-lg" type="button" [disabled]="saving" (click)="cancel()">

                        Cancel

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>
