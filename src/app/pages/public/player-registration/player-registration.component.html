<div class="public-registration">
  <div class="registration-card">
    <div class="registration-header">
      <img *ngIf="auction?.logo" [src]="auction?.logo" alt="Auction logo">
      <h1>{{auction?.auctionName || "Cricbids"}}</h1>
      <p>Player Self Registration</p>
    </div>

    <div *ngIf="loading" class="message">Loading registration...</div>

    <div *ngIf="!loading && !registrationEnabled" class="message closed">
      Player registration is currently closed.
    </div>

    <div *ngIf="!loading && registrationEnabled && submitted" class="message success">
      Registration submitted successfully. Your name will appear in the player list.
    </div>

    <form *ngIf="!loading && registrationEnabled && !submitted" [formGroup]="form" (ngSubmit)="submit()">
      <p class="required-fields-hint">Fields marked <span class="required-marker" aria-hidden="true">*</span> are required.</p>
      <div class="photo-row">
        <div class="photo-loader" *ngIf="uploadingPhoto">
          <div class="spinner" aria-label="Uploading"></div>
          <div class="loader-text">Uploading photo...</div>
        </div>

        <img *ngIf="photoPreview && !uploadingPhoto" [src]="photoPreview" alt="Player photo">
        <div *ngIf="!photoPreview && !uploadingPhoto" class="photo-placeholder">Photo</div>

        <label for="player-registration-photo">Photo <span class="required-marker" aria-hidden="true">*</span></label>
        <input id="player-registration-photo" aria-required="true" aria-describedby="player-registration-photo-error" [class.is-invalid]="form.controls.photo.invalid && form.controls.photo.touched" [attr.aria-invalid]="form.controls.photo.invalid && form.controls.photo.touched" (blur)="form.controls.photo.markAsTouched()"
          type="file"
          accept="image/*"
          [disabled]="saving || uploadingPhoto"
          (change)="onPhotoChange($event)"
        />
        <app-field-error [control]="form.controls.photo" label="Photo" fieldId="player-registration-photo" />
      </div>

      <div class="form-grid">
        <label for="player-registration-firstName">
          <span class="field-label">First Name <span class="required-marker" aria-hidden="true">*</span></span>
          <input id="player-registration-firstName" aria-describedby="player-registration-firstName-error" [class.is-invalid]="form.controls.firstName.invalid && form.controls.firstName.touched" [attr.aria-invalid]="form.controls.firstName.invalid && form.controls.firstName.touched" aria-required="true" formControlName="firstName">
          <app-field-error [control]="form.controls.firstName" label="First Name" fieldId="player-registration-firstName" />
        </label>

        <label for="player-registration-lastName">
          <span class="field-label">Last Name <span class="required-marker" aria-hidden="true">*</span></span>
          <input id="player-registration-lastName" aria-describedby="player-registration-lastName-error" [class.is-invalid]="form.controls.lastName.invalid && form.controls.lastName.touched" [attr.aria-invalid]="form.controls.lastName.invalid && form.controls.lastName.touched" aria-required="true" formControlName="lastName">
          <app-field-error [control]="form.controls.lastName" label="Last Name" fieldId="player-registration-lastName" />
        </label>

        <label for="player-registration-mobile">
          <span class="field-label">Mobile Number <span class="required-marker" aria-hidden="true">*</span></span>
          <input id="player-registration-mobile" aria-describedby="player-registration-mobile-error" [class.is-invalid]="form.controls.mobile.invalid && form.controls.mobile.touched" [attr.aria-invalid]="form.controls.mobile.invalid && form.controls.mobile.touched" aria-required="true" type="tel" maxlength="10" formControlName="mobile" (keypress)="allowOnlyNumbers($event)">
          <app-field-error [control]="form.controls.mobile" label="Mobile Number" fieldId="player-registration-mobile" patternMessage="Enter a valid 10-digit mobile number." />
        </label>

        <label for="player-registration-jerseyNumber">
          <span class="field-label">Jersey Number <span class="required-marker" aria-hidden="true">*</span></span>
          <input id="player-registration-jerseyNumber" aria-describedby="player-registration-jerseyNumber-error" [class.is-invalid]="form.controls.jerseyNumber.invalid && form.controls.jerseyNumber.touched" [attr.aria-invalid]="form.controls.jerseyNumber.invalid && form.controls.jerseyNumber.touched" aria-required="true" type="tel" maxlength="3" formControlName="jerseyNumber" (keypress)="allowOnlyNumbers($event)">
          <app-field-error [control]="form.controls.jerseyNumber" label="Jersey Number" fieldId="player-registration-jerseyNumber" patternMessage="Jersey number must contain 1 to 3 digits." />
        </label>

        <label for="player-registration-playerType">
          <span class="field-label">Player Type <span class="required-marker" aria-hidden="true">*</span></span>
          <select id="player-registration-playerType" aria-describedby="player-registration-playerType-error" [class.is-invalid]="form.controls.playerType.invalid && form.controls.playerType.touched" [attr.aria-invalid]="form.controls.playerType.invalid && form.controls.playerType.touched" aria-required="true" formControlName="playerType">
            <option value="">Select</option>
            <option>Batsman</option>
            <option>Bowler</option>
            <option>All Rounder</option>
            <option>Wicket Keeper</option>
          </select>
          <app-field-error [control]="form.controls.playerType" label="Player Type" fieldId="player-registration-playerType" />
        </label>

        <label>
          <span class="field-label">Current Team</span>
          <input formControlName="currentTeam" placeholder="Enter current team name">
        </label>

        <label>
          <span class="field-label">Category</span>
          <select formControlName="categoryId">
            <option value="" disabled>Select Category</option>
            <option *ngFor="let category of categories" [value]="category.id">{{category.name}}</option>
          </select>
        </label>

        <label for="player-registration-tshirtSize">
          <span class="field-label">T-Shirt Size <span class="required-marker" aria-hidden="true">*</span></span>
          <select id="player-registration-tshirtSize" aria-describedby="player-registration-tshirtSize-error" [class.is-invalid]="form.controls.tshirtSize.invalid && form.controls.tshirtSize.touched" [attr.aria-invalid]="form.controls.tshirtSize.invalid && form.controls.tshirtSize.touched" aria-required="true" formControlName="tshirtSize">
            <option value="">Select</option>
            <option>S</option>
            <option>M</option>
            <option>L</option>
            <option>XL</option>
            <option>2XL</option>
            <option>3XL</option>
            <option>4XL</option>
          </select>
          <app-field-error [control]="form.controls.tshirtSize" label="T-Shirt Size" fieldId="player-registration-tshirtSize" />
        </label>

        <label>
          <span class="field-label">Trouser Size</span>
          <select formControlName="trouserSize">
            <option value="">Select</option>
            <option>28</option>
            <option>30</option>
            <option>32</option>
            <option>34</option>
            <option>36</option>
            <option>38</option>
            <option>40</option>
            <option>42</option>
            <option>44</option>
            <option>46</option>
            <option>48</option>
          </select>

        </label>

      </div>

      <label>
          <span class="field-label">Note</span>
          <textarea rows="3" formControlName="note"></textarea>
      </label>

      <button type="submit" [disabled]="saving || uploadingPhoto">
        {{uploadingPhoto ? 'Uploading photo...' : (saving ? 'Submitting...' : 'Submit Registration')}}
      </button>
    </form>
  </div>
</div>
