<div class="public-registration">
  <div class="registration-card">
    <div class="registration-header">
      <img *ngIf="auction?.logo" [src]="auction?.logo" alt="Auction logo">
      <h1>{{auction?.auctionName || "Cricbids"}}</h1>
      <p>Player Self Registration</p>
    </div>

    <div *ngIf="loading" class="message">Loading registration...</div>

    <div *ngIf="!loading && !registrationEnabled" class="message closed">
      Player registration is currently closed.
    </div>

    <div *ngIf="!loading && registrationEnabled && submitted" class="message success">
      Registration submitted successfully. Your name will appear in the player list.
    </div>

    <form *ngIf="!loading && registrationEnabled && !submitted" [formGroup]="form" (ngSubmit)="submit()">
      <div class="photo-row">
        <div class="photo-loader" *ngIf="uploadingPhoto">
          <div class="spinner" aria-label="Uploading"></div>
          <div class="loader-text">Uploading photo...</div>
        </div>

        <img *ngIf="photoPreview && !uploadingPhoto" [src]="photoPreview" alt="Player photo">
        <div *ngIf="!photoPreview && !uploadingPhoto" class="photo-placeholder">Photo</div>

        <input
          type="file"
          accept="image/*"
          (change)="onPhotoChange($event)"
        />
        <small class="error text-danger" *ngIf="form.get('photo')?.touched && form.get('photo')?.invalid">
          Photo is required.
        </small>
      </div>

      <div class="form-grid">
        <label>
          First Name *
          <input formControlName="firstName">
          <small class="error" *ngIf="form.get('firstName')?.touched && form.get('firstName')?.invalid">
            First name is required.
          </small>
        </label>

        <label>
          Last Name *
          <input formControlName="lastName">
          <small class="error" *ngIf="form.get('lastName')?.touched && form.get('lastName')?.invalid">
            Last name is required.
          </small>
        </label>

        <label>
          Mobile Number *
          <input type="tel" maxlength="10" formControlName="mobile" (keypress)="allowOnlyNumbers($event)">
          <small class="error" *ngIf="form.get('mobile')?.touched && form.get('mobile')?.invalid">
            Enter a valid 10-digit mobile number.
          </small>
        </label>

        <label>
          Player Type *
          <select formControlName="playerType">
            <option value="">Select</option>
            <option>Batsman</option>
            <option>Bowler</option>
            <option>All Rounder</option>
            <option>Wicket Keeper</option>
          </select>
          <small class="error" *ngIf="form.get('playerType')?.touched && form.get('playerType')?.invalid">
            Player type is required.
          </small>
        </label>

        <label>
          T-Shirt Size *
          <select formControlName="tshirtSize">
            <option value="">Select</option>
            <option>S</option>
            <option>M</option>
            <option>L</option>
            <option>XL</option>
            <option>2XL</option>
            <option>3XL</option>
            <option>4XL</option>
          </select>
          <small class="error" *ngIf="form.get('tshirtSize')?.touched && form.get('tshirtSize')?.invalid">
            T-shirt size is required.
          </small>
        </label>

        <label>
          Trouser Size *
          <select formControlName="trouserSize">
            <option value="">Select</option>
            <option>28</option>
            <option>30</option>
            <option>32</option>
            <option>34</option>
            <option>36</option>
            <option>38</option>
            <option>40</option>
            <option>42</option>
          </select>
          <small class="error" *ngIf="form.get('trouserSize')?.touched && form.get('trouserSize')?.invalid">
            Trouser size is required.
          </small>
        </label>

      </div>

      <label>
        Note
        <textarea rows="3" formControlName="note"></textarea>
      </label>

      <button type="submit" [disabled]="saving">
        {{saving ? 'Submitting...' : 'Submit Registration'}}
      </button>
    </form>
  </div>
</div>
