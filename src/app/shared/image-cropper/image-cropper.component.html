<div class="backdrop" role="dialog" aria-modal="true" [attr.aria-label]="'Crop ' + label"><section><header><div><h2>Crop {{ label }}</h2><p>Move or resize the box to select the {{ label }}.</p></div><button type="button" aria-label="Close" (click)="cancelled.emit()">&times;</button></header><div #workspace class="workspace" (pointermove)="dragSelection($event)" (pointerup)="endDrag()" (pointercancel)="endDrag()"><img [src]="url" (load)="onImageLoad($event)" [alt]="label + ' to crop'"><div *ngIf="imageReady" class="selection" [style.left.px]="selection.x" [style.top.px]="selection.y" [style.width.px]="selection.width" [style.height.px]="selection.height" (pointerdown)="startDrag($event)"><span class="handle n" (pointerdown)="startDrag($event, 'n')"></span><span class="handle ne" (pointerdown)="startDrag($event, 'ne')"></span><span class="handle e" (pointerdown)="startDrag($event, 'e')"></span><span class="handle se" (pointerdown)="startDrag($event, 'se')"></span><span class="handle s" (pointerdown)="startDrag($event, 's')"></span><span class="handle sw" (pointerdown)="startDrag($event, 'sw')"></span><span class="handle w" (pointerdown)="startDrag($event, 'w')"></span><span class="handle nw" (pointerdown)="startDrag($event, 'nw')"></span></div></div><footer><button type="button" class="btn btn-outline-secondary" (click)="cancelled.emit()">Cancel</button><button type="button" class="btn btn-primary" [disabled]="!imageReady" (click)="save()">Crop &amp; upload</button></footer></section></div>
